
name: Alify - Compilar iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar Alify para iOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: Alify-iOS

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Alify-iOS/package-lock.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar frontend
        run: npm run build:ios-ui

      - name: Preparar proyecto iOS
        run: npm run ios:prepare

  
      - name: Verificar proyecto Xcode
        run: |
          echo "=== Proyectos Xcode ==="
          find src-tauri/gen/apple -name "*.xcodeproj"

          echo "=== Esquemas disponibles ==="
          xcodebuild -list \
            -project src-tauri/gen/apple/Alify.xcodeproj

          echo "=== Archivos de esquemas ==="
          find src-tauri/gen/apple \
            -name "*.xcscheme" -print

      - name: Compilar para simulador
        run: |

      - name: Comprobar esquemas de compilacion
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          project = "src-tauri/gen/apple/Alify.xcodeproj"

          result = subprocess.run(
              ["xcodebuild", "-list", "-json",
               "-project", project],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)
          schemes = data.get("project", {}).get("schemes", [])

          print("Esquemas encontrados:", schemes)

          if not schemes:
              print("No existen esquemas compartidos.")
              print("Hay que revisar la generacion de Xcode.")
          else:
              print("Esquemas disponibles para compilar:")
              for scheme in schemes:
                  print(" -", scheme)
          PY


      - name: Guardar resultado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Alify-iOS-Simulator
          path: Alify-iOS/build-ios/Build/Products/Debug-iphonesimulator/
          if-no-files-found: error
